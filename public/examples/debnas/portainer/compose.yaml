# Generic example based on the upstream Portainer CE installation guide.
services:
  portainer:
    image: portainer/portainer-ce:lts
    restart: always
    ports:
      - 9443:9443
      # Add 8000:8000 only when using Edge Agents.
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - portainer_data:/data
volumes:
  portainer_data:
